name: cp315 wheels

# Builds cp315 manylinux wheels for the audio/ML packages that ship no cp315
# wheel upstream. Artifacts land on every push; tags turn them into release
# assets that pip can install straight from the release URL.
#
# Each matrix entry declares what decides whether a cp315 wheel can exist:
# where the source comes from, which manylinux image to build in, what the host
# needs before metadata generation, what the build container needs, and what the
# import test needs. Every value is written after reading a failed run — the
# run-by-run diagnosis is in README "Build results".
#
# Not in the matrix, on purpose: ctranslate2. python/pyproject.toml is plain
# setuptools and setup.py compiles cpp/*.cc while expecting the C++ core and its
# generated headers to exist already. That is a dedicated CMake-then-bindings
# build, not a matrix line.
#
# Quoting rule learned the hard way: CIBW_BEFORE_ALL_* is itself wrapped in
# `sh -c`, so nested quotes around $(...) get mangled (v4.1's ninja copy died
# that way, silently). Keep container commands quote-free or let a package
# manager do the work.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheels:
    name: ${{ matrix.package }} (cp315)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Green since v2: the extension compiles in seconds; the import only
          # needs setuptools<81 for the removed pkg_resources.
          - package: webrtcvad
            origin: pypi
            manylinux_image: ""
            host_system: ""
            host_pip: ""
            container_system: ""
            container_env: ""
            test_extra: "setuptools<81"
            module: webrtcvad
          # v2: no Ninja. v3/v4.1: pip's ninja wheel landed off-PATH, and the
          # shell-quoted copy was mangled by cibuildwheel's own `sh -c` wrapper,
          # so `cp` and `which` both failed quietly and CMake still saw nothing.
          # v7: EPEL carries ninja-build — no quoting, no PATH games.
          - package: praat-parselmouth
            origin: pypi
            manylinux_image: ""
            host_system: ""
            host_pip: ""
            container_system: "yum install -y epel-release; yum install -y ninja-build; ninja --version"
            container_env: ""
            test_extra: ""
            module: parselmouth
          # v3: 'yum install ffmpeg-devel' -> no match (EPEL has no FFmpeg).
          # v4: RPM Fusion on Alma 8 -> compile died on AV_HWDEVICE_TYPE_AMF.
          # v5: manylinux_2_34 with el9 RPM Fusion -> died on
          # AV_HWDEVICE_TYPE_OHCODEC. Both enums are FFmpeg 7.1+, and no RPM
          # Fusion repo for el8/el9 carries FFmpeg 7 — so the container builds
          # FFmpeg 9.0.2 from source and installs it to /usr with pkg-config
          # metadata. That is the real prerequisite; everything else was noise.
          - package: av
            origin: pypi
            manylinux_image: manylinux_2_34
            host_system: "sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev"
            host_pip: ""
            container_system: >-
              yum install -y epel-release;
              yum install -y pkgconf-pkg-config nasm yasm gcc-c++ make xz;
              curl -sL https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz -o /tmp/ffmpeg.tar.xz;
              tar -xf /tmp/ffmpeg.tar.xz -C /tmp;
              cd /tmp/ffmpeg-9.0.2;
              ./configure --prefix=/usr --enable-shared --disable-static --enable-gpl --enable-pic --disable-doc --libdir=/usr/lib64;
              make -j$(nproc);
              make install;
              ldconfig;
              export PKG_CONFIG_PATH=/usr/lib64/pkgconfig:/usr/share/pkgconfig;
              pkg-config --modversion libavcodec
            container_env: ""
            test_extra: ""
            module: av
          # v2: cargo is needed during host-side metadata generation, not only in
          # the build container. v3: that step also needs clang's bindings.
          # v5: "pip install libclang" installs the *clang* package — there is no
          # libclang module (verified against the wheel: it ships
          # clang/native/libclang.so). v6 pointed LIBCLANG_PATH at that dir and
          # still failed: clang/cindex.py called dlopen("libclang.so") with no
          # path, because the metadata build runs in pip's isolated build env
          # where that variable never arrived. v7 stops relying on the variable:
          # the .so goes to /usr/local/lib + ldconfig, and a smoke test loads it
          # with no env vars set at all.
          - package: pymupdf
            origin: pypi
            manylinux_image: ""
            host_system: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
            host_pip: "libclang"
            container_system: >-
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y;
              python -m pip install libclang;
              cp $(python -c "import clang, os; print(os.path.dirname(clang.__file__))")/native/libclang.so /usr/local/lib/libclang.so;
              ldconfig
            container_env: "PATH=$HOME/.cargo/bin:$PATH "
            module: pymupdf
            limited_api_off: "0"
            fetch_mode: tarball
            patches: pymupdf-cp315
            cflags: "-DPyString_FromString=PyUnicode_FromString -DPyString_FromStringAndSize=PyUnicode_FromStringAndSize"
            test_extra: ""
    env:
      CIBW_BUILD: cp315-manylinux_x86_64
      PYMUPDF_SETUP_PY_LIMITED_API: ${{ matrix.limited_api_off }}
      CFLAGS: ${{ matrix.cflags }}
      CXXFLAGS: ${{ matrix.cflags }}
      # MuPDF builds the SWIG wrapper through its own Maker, which reads
      # XCFLAGS/XCXXFLAGS -- plain CFLAGS never reaches it (v11 proved that).
      XCFLAGS: ${{ matrix.cflags }}
      XCXXFLAGS: ${{ matrix.cflags }}
      CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
      CIBW_BEFORE_ALL_LINUX: ${{ matrix.container_system }}
      CIBW_ENVIRONMENT_LINUX: ${{ matrix.container_env }}
      CIBW_BEFORE_TEST_LINUX: ${{ matrix.test_extra && format('python -m pip install "{0}"', matrix.test_extra) || 'true' }}
      CIBW_BUILD_VERBOSITY: "1"
      # A wheel that installs but cannot import is not a wheel.
      CIBW_TEST_COMMAND: python -c "import importlib; m=importlib.import_module('${{ matrix.module }}'); print('IMPORT OK', getattr(m,'__version__','?'))"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # host interpreter for the cibuildwheel CLI only

      # Installed in its own step and exported through $GITHUB_PATH/$GITHUB_ENV:
      # `export` inside a step does not reach the next one, which is how v2's
      # Rust install went missing.
      - name: Host-side system packages
        if: matrix.host_system != '' || matrix.host_pip != ''
        run: |
          if [ -n "${{ matrix.host_system }}" ]; then eval "${{ matrix.host_system }}"; fi
          if [ -n "${{ matrix.host_pip }}" ];    then python -m pip install ${{ matrix.host_pip }}; fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Host-side env for pymupdf
        if: matrix.package == 'pymupdf'
        run: |
          LIBCLANG_DIR="$(python -c 'import clang, os; print(os.path.join(os.path.dirname(clang.__file__), "native"))')"
          ls -la "$LIBCLANG_DIR/libclang.so"
          # v7 proved ldconfig is not enough: the file was copied to
          # /usr/local/lib and the smoke test still could not dlopen it. So put
          # the library where the runner already looks: the toolcache lib dir is
          # baked into LD_LIBRARY_PATH for every step of the job, and pip's
          # isolated build env inherits it, which is exactly what the failing
          # metadata step needed.
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          sudo cp "$LIBCLANG_DIR/libclang.so" "$LIBDIR/libclang.so"
          echo "LD_LIBRARY_PATH=$LIBDIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          export LD_LIBRARY_PATH="$LIBDIR:${LD_LIBRARY_PATH:-}"
          # Proof, not hope: load it with no LIBCLANG_* variable set anywhere.
          env -u LIBCLANG_PATH -u LIBCLANG_LIBRARY_PATH python -c "import ctypes, ctypes.util; ctypes.CDLL('libclang.so'); print('libclang.so resolves', ctypes.util.find_library('clang') or 'via LD_LIBRARY_PATH')"
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          echo "LIBCLANG_LIBRARY_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"

      - name: Prepare cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          mkdir -p dl src

      - name: Fetch source tarball from PyPI (no build)
        if: matrix.origin == 'pypi' && matrix.fetch_mode == 'tarball'
        run: |
          # pip's own download path prepares metadata for sdists, which for
          # pymupdf means a full MuPDF build on the host -- from a private temp
          # copy a source patch could never reach. Fetch the tarball directly.
          python - "${{ matrix.package }}" <<'EOF'
          import json, pathlib, sys, urllib.request
          pkg = sys.argv[1]
          d = json.load(urllib.request.urlopen(f"https://pypi.org/pypi/{pkg}/json"))
          url = [f["url"] for f in d["urls"] if f["filename"].endswith((".tar.gz", ".zip"))][0]
          print("tarball:", url)
          pathlib.Path("dl").mkdir(exist_ok=True)
          urllib.request.urlretrieve(url, "dl/" + url.rsplit("/", 1)[1])
          EOF
          shopt -s nullglob
          for f in dl/*.tar.gz dl/*.tgz; do tar -xzf "$f" -C src; done
          for f in dl/*.zip;            do unzip -q  "$f" -d src; done
          ls -la src/

      # MuPDF's wrapper generator writes the C++ itself. src/*.i can be
      # clean and the generated file still carries the alias: scripts/wrap/
      # swig.py:743 emits PyString_FromString("format_tb") into every wrapper
      # it produces. Patch the generator, hand PyMuPDF the patched MuPDF
      # tarball through its own documented knob (PYMUPDF_SETUP_MUPDF_TGZ
      # accepts a local .tgz), and gate on zero mentions remaining.
      - name: Patch MuPDF's wrapper generator
        if: matrix.patches == 'pymupdf-cp315'
        run: |
          set -euo pipefail
          VER=$(grep -oE "^version_mupdf = '[0-9.]+'" src/pymupdf-*/setup.py | head -1 | cut -d"'" -f2)
          echo "MuPDF source version: $VER"
          URL="https://mupdf.com/downloads/archive/mupdf-${VER}-source.tar.gz"
          mkdir -p dl mu
          curl -sSL -o dl/mupdf-src.tar.gz "$URL"
          tar -xzf dl/mupdf-src.tar.gz -C mu
          DIR=$(ls -d mu/*/ | head -1); DIR=${DIR%/}
          NAME=$(basename "$DIR")
          before=$( (grep -rn "PyString_" "$DIR" || true) | wc -l )
          grep -rl "PyString_" "$DIR" | while read -r f; do
            sed -i 's/\bPyString_FromStringAndSize\b/PyUnicode_AsUTF8AndSize/g; s/\bPyString_AsStringAndSize\b/PyUnicode_AsUTF8AndSize/g; s/\bPyString_AsString\b/PyUnicode_AsUTF8/g; s/\bPyString_FromString\b/PyUnicode_FromString/g' "$f"
            echo "patched: $f"
          done
          # grep exits 1 when it finds nothing, and `set -e` plus pipefail
          # would then kill the step that exists to prove nothing is left.
          left=$( (grep -rn "PyString_" "$DIR" || true) | wc -l )
          echo "PyString_* in the MuPDF tree: $before -> $left"
          test "$left" -eq 0
          tar -czf "dl/${NAME}.tar.gz" -C mu "$NAME"
          ls -la "dl/${NAME}.tar.gz"
          echo "host path:      $(pwd)/dl/${NAME}.tar.gz"
          # the container sees the repo at /project:
          echo "PYMUPDF_SETUP_MUPDF_TGZ=$(pwd)/dl/${NAME}.tar.gz" >> "$GITHUB_ENV"
          # Single quotes matter: CIBW_ENVIRONMENT_LINUX is a *container-side*
          # string. Unquoted, the host shell expands $HOME/$PATH here and the
          # container gets the runner's PATH -- which broke `which python` in v16.
          printf 'CIBW_ENVIRONMENT_LINUX=%s PYMUPDF_SETUP_MUPDF_TGZ=/project/dl/%s.tar.gz\n' \
            '${{ matrix.container_env }}' "${NAME}" >> "$GITHUB_ENV"
          grep -h CIBW_ENVIRONMENT_LINUX "$GITHUB_ENV"

      - name: Apply cp315 source patches
        if: matrix.patches == 'pymupdf-cp315'
        run: |
          # src/extra.i and src_classic/helper-fields.i call PyString_FromString,
          # a Python-2 alias that CPython 3.15 headers no longer declare. SWIG
          # regenerates the wrapper from these files, so the alias has to be
          # mapped in the source itself (v11/v12 proved CFLAGS cannot help).
          before=$(grep -rn "PyString_" src/ | wc -l)
          echo "згадак PyString_* да патча: $before"
          # every file with any PyString_* alias, not just the FromString ones:
          # helper-xobject.i:140 calls PyString_AsString.
          grep -rl "PyString_" src/ | while read -r f; do
            sed -i 's/\bPyString_AsString\b/PyUnicode_AsUTF8/g; s/\bPyString_FromStringAndSize\b/PyUnicode_AsUTF8AndSize/g; s/\bPyString_FromString\b/PyUnicode_FromString/g' "$f"
            echo "patched: $f"
          done
          left=$(grep -rn "\bPyString_" src/ | wc -l)
          echo "засталося згадак PyString_*: $left"
          test "$left" -eq 0

      - name: Fetch source from PyPI
        if: matrix.origin == 'pypi' && matrix.fetch_mode != 'tarball'
        run: |
          python -m pip download --no-deps --no-binary :all: -d dl "${{ matrix.package }}"
          shopt -s nullglob
          for f in dl/*.tar.gz dl/*.tgz; do tar -xzf "$f" -C src; done
          for f in dl/*.zip;            do unzip -q  "$f" -d src; done
          ls -la src/

      - name: Fetch source from git
        if: matrix.origin == 'git'
        run: |
          if [ "${{ matrix.submodules }}" = "true" ]; then
            git clone --depth 1 --branch "${{ matrix.git_tag }}" --recurse-submodules --shallow-submodules "${{ matrix.git_url }}" "src/${{ matrix.package }}"
          else
            git clone --depth 1 --branch "${{ matrix.git_tag }}" "${{ matrix.git_url }}" "src/${{ matrix.package }}"
          fi
          ls -la src/

      - name: Build the wheel
        run: |
          TARGET="${{ matrix.package_dir }}"
          [ -n "$TARGET" ] || TARGET=$(ls -d src/*/ | head -1)
          echo "building $TARGET in ${CIBW_MANYLINUX_X86_64_IMAGE:-default image}"
          python -m cibuildwheel --output-dir wheelhouse "$TARGET"

      - name: Show what we built
        run: |
          ls -la wheelhouse/
          for w in wheelhouse/*.whl; do
            echo "--- $w"
            unzip -l "$w" | grep -E '\.so|\.pyd' | head -5
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.package }}-cp315
          path: wheelhouse/*.whl
          if-no-files-found: warn

  release:
    name: attach wheels to release
    # Publish whatever is green: a tag must not be hostage to a package that is
    # still blocked upstream.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: false

  blocked-upstream:
    name: report what stays blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the upstream-blocked set
        run: python3 py315_probe.py --cp 315 --packages torch torchaudio onnxruntime
