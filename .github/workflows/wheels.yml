name: cp315 wheels

# Builds cp315 manylinux wheels for the audio/ML packages that ship no cp315
# wheel upstream. Artifacts land on every push; tags turn them into release
# assets that pip can install straight from the release URL.
#
# Each matrix entry declares the five things that decide whether a cp315 wheel
# can exist: where the source comes from (and whether its git submodules are
# needed), what the *host* needs before metadata generation, what the build
# container needs, what environment both need, and what the import test needs.
# Every value is written after reading a failed run — see README "Build results".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheels:
    name: ${{ matrix.package }} (cp315)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Green since v2: the extension compiles in seconds; the import only
          # needs setuptools<81 for the removed pkg_resources.
          - package: webrtcvad
            origin: pypi
            host_system: ""
            host_pip: ""
            host_env_cmd: ""
            container_system: ""
            container_env: ""
            test_extra: "setuptools<81"
          # v3 compiled the whole Praat C++ core (still running at ~20 min) after
          # v2 died on the missing Ninja.
          - package: praat-parselmouth
            origin: pypi
            host_system: ""
            host_pip: ""
            host_env_cmd: ""
            container_system: "python -m pip install swig ninja"
            container_env: ""
            test_extra: ""
          # v3: `yum install ffmpeg-devel` → "Unable to find a match". EPEL alone
          # does not carry FFmpeg; the RPM Fusion free repo has to be added
          # explicitly, and manylinux_2_28 is AlmaLinux 8.
          - package: av
            origin: pypi
            host_system: "sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev"
            host_pip: ""
            host_env_cmd: ""
            container_system: "yum install -y epel-release || true; yum install -y https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-8.noarch.rpm || true; yum install -y pkgconf-pkg-config || true; yum install -y ffmpeg-devel"
            container_env: ""
            test_extra: ""
          # v3: metadata generation on the host died on libclang — mupdfwrap.py
          # drives clang's Python bindings before cibuildwheel is reached.
          - package: pymupdf
            origin: pypi
            host_system: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
            host_pip: "libclang"
            host_env_cmd: 'printf "LIBCLANG_PATH=%s\n" "$(python -c \"import libclang,os;print(os.path.dirname(libclang.__file__))\")"'
            container_system: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
            container_env: "PATH=$HOME/.cargo/bin:$PATH"
            test_extra: ""
          # v3 reached the compiler and died on missing headers: a shallow clone
          # without submodules has no spdlog/cpu_features, so CMake cannot
          # generate ctranslate2/*.h. Source is python/, not the repo root.
          - package: ctranslate2
            origin: git
            git_url: https://github.com/OpenNMT/CTranslate2.git
            git_tag: v4.8.2
            submodules: "true"
            package_dir: src/ctranslate2/python/
            host_system: ""
            host_pip: ""
            host_env_cmd: ""
            container_system: "yum install -y cmake ninja-build"
            container_env: ""
            test_extra: ""
    env:
      CIBW_BUILD: cp315-manylinux_x86_64
      CIBW_BEFORE_ALL_LINUX: ${{ matrix.container_system }}
      CIBW_ENVIRONMENT_LINUX: ${{ matrix.container_env }}
      CIBW_BEFORE_TEST_LINUX: ${{ matrix.test_extra && format('python -m pip install "{0}"', matrix.test_extra) || 'true' }}
      CIBW_BUILD_VERBOSITY: "1"
      # A wheel that installs but cannot import is not a wheel.
      CIBW_TEST_COMMAND: python -c "import importlib; m=importlib.import_module('${{ matrix.package }}'.replace('-','_')); print('IMPORT OK', getattr(m,'__version__','?'))"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # host interpreter for the cibuildwheel CLI only

      # Host environment is installed in one step and exported through
      # $GITHUB_PATH/$GITHUB_ENV — `export` inside a step does not reach the
      # next one, which is how v2's Rust install went missing.
      - name: Host-side system packages
        if: matrix.host_system != '' || matrix.host_pip != '' || matrix.host_env_cmd != ''
        run: |
          set -x
          [ -n "${{ matrix.host_system }}" ] && eval "${{ matrix.host_system }}"
          [ -n "${{ matrix.host_pip }}" ]    && python -m pip install ${{ matrix.host_pip }}
          [ -n "${{ matrix.host_env_cmd }}" ] && eval "${{ matrix.host_env_cmd }}" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          true

      - name: Prepare cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          mkdir -p dl src

      - name: Fetch source from PyPI
        if: matrix.origin == 'pypi'
        run: |
          python -m pip download --no-deps --no-binary :all: -d dl "${{ matrix.package }}"
          shopt -s nullglob
          for f in dl/*.tar.gz dl/*.tgz; do tar -xzf "$f" -C src; done
          for f in dl/*.zip;            do unzip -q  "$f" -d src; done
          ls -la src/

      - name: Fetch source from git
        if: matrix.origin == 'git'
        run: |
          if [ "${{ matrix.submodules }}" = "true" ]; then
            git clone --depth 1 --branch "${{ matrix.git_tag }}" --recurse-submodules --shallow-submodules "${{ matrix.git_url }}" "src/${{ matrix.package }}"
          else
            git clone --depth 1 --branch "${{ matrix.git_tag }}" "${{ matrix.git_url }}" "src/${{ matrix.package }}"
          fi
          ls -la src/

      - name: Build the wheel
        run: |
          TARGET="${{ matrix.package_dir }}"
          [ -n "$TARGET" ] || TARGET=$(ls -d src/*/ | head -1)
          echo "building $TARGET"
          python -m cibuildwheel --output-dir wheelhouse "$TARGET"

      - name: Show what we built
        run: |
          ls -la wheelhouse/
          for w in wheelhouse/*.whl; do
            echo "--- $w"
            unzip -l "$w" | grep -E '\.so|\.pyd' | head -5
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.package }}-cp315
          path: wheelhouse/*.whl
          if-no-files-found: warn

  release:
    name: attach wheels to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true

  blocked-upstream:
    name: report what stays blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the upstream-blocked set
        run: python3 py315_probe.py --cp 315 --packages torch torchaudio onnxruntime
