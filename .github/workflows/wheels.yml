name: cp315 wheels

# Builds cp315 manylinux wheels for the audio/ML packages that ship no cp315
# wheel upstream. Artifacts land on every push; tags turn them into release
# assets that pip can install straight from the release URL.
#
# Each matrix entry declares the things that decide whether a cp315 wheel can
# exist: where the source comes from (and whether its git submodules are
# needed), which manylinux image to build in, what the *host* needs before
# metadata generation, what the build container needs, and what the import test
# needs. Every value below is written after reading a failed run — the run-by-run
# diagnosis is in README "Build results".
#
# Not in the matrix, on purpose: ctranslate2. Its python/pyproject.toml uses
# plain setuptools and its setup.py compiles cpp/*.cc while expecting the C++
# core and its generated headers to exist already — building it needs a CMake
# step over the whole repo first, then the bindings. That is a dedicated build,
# not a matrix line.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheels:
    name: ${{ matrix.package }} (cp315)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Green since v2: the extension compiles in seconds; the import only
          # needs setuptools<81 for the removed pkg_resources.
          - package: webrtcvad
            origin: pypi
            manylinux_image: ""
            host_system: ""
            host_pip: ""
            container_system: ""
            container_env: ""
            test_extra: "setuptools<81"
          # v2: died on missing Ninja. v3: 'pip install ninja' put the binary in
          # the container python's bin dir, which is not on PATH, so CMake still
          # refused. v4.1 copies it to /usr/local/bin and verifies with `which`.
          - package: praat-parselmouth
            origin: pypi
            manylinux_image: ""
            host_system: ""
            host_pip: ""
            container_system: >-
              python -m pip install swig ninja;
              NINJA=$(python -c "import ninja, os; print(os.path.join(os.path.dirname(ninja.__file__), 'data', 'bin', 'ninja'))");
              cp "$NINJA" /usr/local/bin/ninja 2>/dev/null || true;
              which ninja || yum install -y ninja-build
            container_env: ""
            test_extra: ""
          # v3: 'yum install ffmpeg-devel' -> no match (EPEL has no FFmpeg).
          # v4: RPM Fusion fixed that, and the build then failed on real API
          # gaps: 'av_channel_layout_describe' undeclared, 'AVCodecParameters'
          # has no member 'ch_layout'. AlmaLinux 8 carries FFmpeg 4.2; PyAV needs
          # a much newer one, so this target builds in manylinux_2_34 (Alma 9)
          # with the el9 RPM Fusion repo.
          - package: av
            origin: pypi
            manylinux_image: manylinux_2_34
            host_system: "sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev"
            host_pip: ""
            container_system: "yum install -y epel-release || true; yum install -y https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-9.noarch.rpm || true; yum install -y pkgconf-pkg-config || true; yum install -y ffmpeg-devel"
            container_env: ""
            test_extra: ""
          # v2: cargo runs during host-side metadata generation, not only in the
          # build container. v3: that step also needs clang's Python bindings
          # (libclang.so) — mupdfwrap.py drives them. v4.1 proved the matrix
          # cannot carry a nested-quoted shell expression, hence the dedicated
          # step below.
          - package: pymupdf
            origin: pypi
            manylinux_image: ""
            host_system: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
            host_pip: "libclang"
            container_system: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
            container_env: "PATH=$HOME/.cargo/bin:$PATH"
            test_extra: ""
    env:
      CIBW_BUILD: cp315-manylinux_x86_64
      CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
      CIBW_BEFORE_ALL_LINUX: ${{ matrix.container_system }}
      CIBW_ENVIRONMENT_LINUX: ${{ matrix.container_env }}
      CIBW_BEFORE_TEST_LINUX: ${{ matrix.test_extra && format('python -m pip install "{0}"', matrix.test_extra) || 'true' }}
      CIBW_BUILD_VERBOSITY: "1"
      # A wheel that installs but cannot import is not a wheel.
      CIBW_TEST_COMMAND: python -c "import importlib; m=importlib.import_module('${{ matrix.package }}'.replace('-','_')); print('IMPORT OK', getattr(m,'__version__','?'))"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # host interpreter for the cibuildwheel CLI only

      # Installed in its own step and exported through $GITHUB_PATH/$GITHUB_ENV:
      # `export` inside a step does not reach the next one, which is how v2's
      # Rust install went missing.
      - name: Host-side system packages
        if: matrix.host_system != '' || matrix.host_pip != ''
        run: |
          if [ -n "${{ matrix.host_system }}" ]; then eval "${{ matrix.host_system }}"; fi
          if [ -n "${{ matrix.host_pip }}" ];    then python -m pip install ${{ matrix.host_pip }}; fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Host-side env for pymupdf
        if: matrix.package == 'pymupdf'
        run: |
          # The PyPI package named "libclang" installs the *clang* package; its
          # shared library lives in clang/native/libclang.so and there is no
          # importable "libclang" module (v5 proved that: ModuleNotFoundError).
          LIBCLANG_PATH="$(python -c 'import clang, os; print(os.path.join(os.path.dirname(clang.__file__), "native"))')"
          ls -la "$LIBCLANG_PATH/libclang.so"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"

      - name: Prepare cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          mkdir -p dl src

      - name: Fetch source from PyPI
        if: matrix.origin == 'pypi'
        run: |
          python -m pip download --no-deps --no-binary :all: -d dl "${{ matrix.package }}"
          shopt -s nullglob
          for f in dl/*.tar.gz dl/*.tgz; do tar -xzf "$f" -C src; done
          for f in dl/*.zip;            do unzip -q  "$f" -d src; done
          ls -la src/

      - name: Fetch source from git
        if: matrix.origin == 'git'
        run: |
          if [ "${{ matrix.submodules }}" = "true" ]; then
            git clone --depth 1 --branch "${{ matrix.git_tag }}" --recurse-submodules --shallow-submodules "${{ matrix.git_url }}" "src/${{ matrix.package }}"
          else
            git clone --depth 1 --branch "${{ matrix.git_tag }}" "${{ matrix.git_url }}" "src/${{ matrix.package }}"
          fi
          ls -la src/

      - name: Build the wheel
        run: |
          TARGET="${{ matrix.package_dir }}"
          [ -n "$TARGET" ] || TARGET=$(ls -d src/*/ | head -1)
          echo "building $TARGET in ${CIBW_MANYLINUX_X86_64_IMAGE:-default image}"
          python -m cibuildwheel --output-dir wheelhouse "$TARGET"

      - name: Show what we built
        run: |
          ls -la wheelhouse/
          for w in wheelhouse/*.whl; do
            echo "--- $w"
            unzip -l "$w" | grep -E '\.so|\.pyd' | head -5
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.package }}-cp315
          path: wheelhouse/*.whl
          if-no-files-found: warn

  release:
    name: attach wheels to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true

  blocked-upstream:
    name: report what stays blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the upstream-blocked set
        run: python3 py315_probe.py --cp 315 --packages torch torchaudio onnxruntime
