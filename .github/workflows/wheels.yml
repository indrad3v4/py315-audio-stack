name: cp315 wheels

# Builds cp315 manylinux wheels for the audio/ML packages that ship no cp315
# wheel upstream. Artifacts land on every push; tags turn them into release
# assets that pip can install straight from the release URL.
#
# Every matrix entry carries the four things that actually decide whether a
# cp315 wheel can exist: where the source comes from, what the host needs before
# metadata generation, what the build container needs, and what the import test
# needs. Diagnosed from real failed runs — see README "Build results".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheels:
    name: ${{ matrix.package }} (cp315)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # cheapest target: one C file, no deps. Its failure mode is not the
          # build but the import: webrtcvad.py does `import pkg_resources`,
          # which setuptools >= 81 no longer ships.
          - package: webrtcvad
            origin: pypi
            host_system: ""
            container_system: ""
            container_env: ""
            test_extra: "setuptools<81"
          # first real C++ target; SWIG is the only external tool.
          - package: praat-parselmouth
            origin: pypi
            host_system: ""
            container_system: "python -m pip install swig"
            container_env: ""
            test_extra: ""
          # needs FFmpeg headers twice: once on the host to generate metadata,
          # once in the build container to compile.
          - package: av
            origin: pypi
            host_system: "sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev"
            container_system: "yum install -y ffmpeg-devel pkgconfig"
            container_env: ""
            test_extra: ""
          # Rust is required, and `export PATH=...` inside before-all does not
          # persist — the toolchain must be installed in before-all and exposed
          # through CIBW_ENVIRONMENT_LINUX.
          - package: pymupdf
            origin: pypi
            host_system: ""
            container_system: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
            container_env: "PATH=$HOME/.cargo/bin:$PATH"
            test_extra: ""
          # ctranslate2 publishes wheels only: zero sdists on PyPI, so the
          # source has to come from git regardless of what pip says.
          - package: ctranslate2
            origin: git
            git_url: https://github.com/OpenNMT/CTranslate2.git
            git_tag: v4.8.2
            host_system: ""
            container_system: "yum install -y cmake"
            container_env: ""
            test_extra: ""
    env:
      CIBW_BUILD: cp315-manylinux_x86_64
      CIBW_BEFORE_ALL_LINUX: ${{ matrix.container_system }}
      CIBW_ENVIRONMENT_LINUX: ${{ matrix.container_env }}
      CIBW_BEFORE_TEST_LINUX: ${{ matrix.test_extra && format('python -m pip install "{0}"', matrix.test_extra) || 'true' }}
      CIBW_BUILD_VERBOSITY: "1"
      # A wheel that installs but cannot import is not a wheel.
      CIBW_TEST_COMMAND: python -c "import importlib; m=importlib.import_module('${{ matrix.package }}'.replace('-','_')); print('IMPORT OK', getattr(m,'__version__','?'))"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # host interpreter for the cibuildwheel CLI only

      - name: Host-side system packages
        if: matrix.host_system != ''
        run: eval "${{ matrix.host_system }}"

      - name: Prepare cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          mkdir -p dl src

      - name: Fetch source from PyPI
        if: matrix.origin == 'pypi'
        run: |
          python -m pip download --no-deps --no-binary :all: -d dl "${{ matrix.package }}"
          shopt -s nullglob
          for f in dl/*.tar.gz dl/*.tgz; do tar -xzf "$f" -C src; done
          for f in dl/*.zip;            do unzip -q  "$f" -d src; done
          ls -la src/

      - name: Fetch source from git
        if: matrix.origin == 'git'
        run: |
          git clone --depth 1 --branch "${{ matrix.git_tag }}" "${{ matrix.git_url }}" "src/${{ matrix.package }}"
          ls -la src/

      - name: Build the wheel
        run: python -m cibuildwheel --output-dir wheelhouse src/*/

      - name: Show what we built
        run: |
          ls -la wheelhouse/
          for w in wheelhouse/*.whl; do
            echo "--- $w"
            unzip -l "$w" | grep -E '\.so|\.pyd' | head -5
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.package }}-cp315
          path: wheelhouse/*.whl
          if-no-files-found: warn

  release:
    name: attach wheels to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true

  blocked-upstream:
    name: report what stays blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the upstream-blocked set
        run: python3 py315_probe.py --cp 315 --packages torch torchaudio onnxruntime
